<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제 실패</title>
    <style>
        table { border-collapse: collapse; width: 100%; max-width: 600px; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>결제 실패</h1>
    <table>
        <thead>
            <tr><th>항목</th><th>값</th></tr>
        </thead>
        <tbody>
            {% if error %}
                <tr><th>code</th><td>{{ error.code }}</td></tr>
                <tr><th>message</th><td>{{ error.message }}</td></tr>
            {% endif %}
        </tbody>
    </table>
</body>
</html>
